<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101721">
  <meta name="robots" content="noindex,nofollow">
  <title>Монеты · тренажёр для глаз</title>
  <link rel="stylesheet" href="./style.css?v=cursor-1">
  <script src="./app.js?v=cursor-1" defer></script>
</head>
<body>
  <main id="stage" aria-label="Две монеты по 50 копеек. Нажмите на свободную область экрана, чтобы открыть или закрыть настройки">
    <div class="ambient" aria-hidden="true"></div>
    <div class="coin" id="coinLeft"><img src="./coin-50.svg?v=tv-fullscreen-2" alt="" draggable="false"></div>
    <div class="coin" id="coinRight"><img src="./coin-50.svg?v=tv-fullscreen-2" alt="" draggable="false"></div>
    <div id="hint" class="hint" aria-hidden="true">Нажмите на экран для настройки</div>
    <section id="controls" class="controls" aria-label="Настройка монет" hidden>
      <div class="topline" aria-hidden="true"><span>ПЕСОЧНИЦА 2</span><span>50 КОПІЙОК · СТОРОНА З ГЕРБОМ</span></div>
      <button id="fullscreenButton" class="fullscreen-button" type="button" data-control>На весь экран</button>
      <p id="fullscreenStatus" class="fullscreen-status" role="status" hidden></p>
      <div class="size-control" data-control>
        <div class="control-heading"><span class="control-mark">01</span><span>Размер монет</span></div>
        <div class="vertical-wrap"><input id="size" class="vertical-range" type="range" min="5" max="17" step="0.2" value="9" aria-label="Размер монет"></div>
        <output id="sizeValue" for="size">9%</output>
      </div>
      <div class="distance-control" data-control>
        <div class="control-heading"><span class="control-mark">02</span><span>Расстояние между монетами</span><output id="distanceValue" for="distance">18%</output></div>
        <input id="distance" type="range" min="0" max="100" step="1" value="18" aria-label="Расстояние между монетами">
        <div class="range-ends"><span>Ближе</span><span>Дальше</span></div>
      </div>
      <p class="care-note" data-control>Изменяйте расстояние плавно. Если возникает двоение, боль или дискомфорт, прекратите занятие.</p>
      <p class="close-note" aria-hidden="true">Нажмите на свободную область, чтобы скрыть настройки</p>
    </section>
  </main>
</body>
</html>
