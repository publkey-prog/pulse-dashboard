<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101928">
  <meta name="robots" content="noindex,nofollow">
  <title>Песочница 2</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101928;color:#f4f7fb}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:680px;width:100%;background:#18263c;border:1px solid #344a68;border-radius:24px;padding:clamp(24px,6vw,48px);box-sizing:border-box}
    .tag{font-size:14px;color:#99d7c4;letter-spacing:.04em;text-transform:uppercase}
    h1{font-size:clamp(32px,7vw,54px);line-height:1.1;margin:16px 0}
    p{font-size:18px;line-height:1.6;color:#d3e0ef;margin:0}
  </style>
</head>
<body>
  <main>
    <div class="tag">Отдельный проект</div>
    <h1>Песочница 2</h1>
    <p>Площадка для публикации и просмотра результатов разработки. Содержимое появится здесь по мере работы над новым проектом.</p>
  </main>
</body>
</html>
