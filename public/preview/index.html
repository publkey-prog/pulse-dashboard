<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Pulse Preview Sandbox</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#131a2c;--text:#f4f7ff;--muted:#a9b2c7;--accent:#7aa2ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#1a2650 0,#0b1020 52%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);padding:24px}
    main{width:min(680px,100%);background:rgba(19,26,44,.92);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(122,162,255,.14);color:#bcd0ff;font-weight:700;font-size:13px;letter-spacing:.04em}
    h1{font-size:clamp(30px,7vw,52px);line-height:1.02;margin:20px 0 14px}
    p{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 22px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:14px;text-decoration:none;background:var(--accent);color:#071026;font-weight:800}
    code{color:#d6e2ff}
  </style>
</head>
<body>
  <main>
    <span class="badge">PREVIEW · SANDBOX</span>
    <h1>Песочница готова</h1>
    <p>Временные проекты будут публиковаться здесь: <code>pulse.publkey.com/preview/</code>. Основной Pulse Dashboard остаётся на корне сайта и не заменяется.</p>
    <a href="/">Открыть Pulse Dashboard</a>
  </main>
</body>
</html>
