name: One-time production working backup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backup-production-working.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore exact working production snapshot
        shell: bash
        run: |
          set -euo pipefail
          WORKING_SHA="72acbd13ceb751f3cc413cb88093065ca9f1feca"
          git checkout "$WORKING_SHA" -- public

      - name: Build production archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backup
          mkdir -p backup/site
          cp public/index.html backup/site/
          cp public/app.js backup/site/
          cp public/style.css backup/site/
          cp public/manifest.json backup/site/
          cp public/sw.js backup/site/
          cp -a public/icons backup/site/
          cat > backup/README.txt <<'EOF'
          PULSE DASHBOARD — CONFIRMED WORKING PRODUCTION BACKUP
          Confirmed date: 2026-11-12
          Repository: publkey-prog/pulse-dashboard
          Working repository commit: 72acbd13ceb751f3cc413cb88093065ca9f1feca
          Production application commit: 01f2e68f243d470ea3833ad840b0585039b409e9

          CONTENT:
          - production index.html
          - app.js
          - style.css
          - manifest.json
          - sw.js
          - icons/

          The preview/ sandbox is intentionally NOT included.
          Restore target: production web root for https://pulse.publkey.com/
          EOF
          (cd backup/site && find . -type f -print0 | sort -z | xargs -0 sha256sum) > backup/SHA256SUMS.txt
          find backup/site -type f | sort > backup/FILELIST.txt

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Pulse_Production_4.0_Working_2026-11-12
          path: backup/
          if-no-files-found: error
          retention-days: 90
