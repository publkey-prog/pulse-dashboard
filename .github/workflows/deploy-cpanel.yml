name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync source package to public
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_SYNC=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_SYNC=true
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^source/'; then
            SHOULD_SYNC=true
          fi

          if [ "$SHOULD_SYNC" = "true" ] && [ -f source/READY ]; then
            cat source/pulse_dashboard_v3_5.zip.b64.part* > "$RUNNER_TEMP/pulse-source.b64"
            base64 -d "$RUNNER_TEMP/pulse-source.b64" > "$RUNNER_TEMP/pulse-source.zip"

            echo "f967509c7baadd1ce46c7602c479cf36330d9dec977d710d8f45abe4702647d4  $RUNNER_TEMP/pulse-source.zip" | sha256sum -c -

            rm -rf "$RUNNER_TEMP/pulse-source"
            mkdir -p "$RUNNER_TEMP/pulse-source"
            unzip -q -o "$RUNNER_TEMP/pulse-source.zip" -d "$RUNNER_TEMP/pulse-source"

            mkdir -p public
            rsync -a --delete "$RUNNER_TEMP/pulse-source/" public/

            node --check public/app.js

            git add public
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Restore Pulse Dashboard v3.5 [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Configure SSH
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$CPANEL_SSH_KEY" > "$RUNNER_TEMP/cpanel_key"
          chmod 600 "$RUNNER_TEMP/cpanel_key"

          cat > "$RUNNER_TEMP/ssh-askpass.sh" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_PASSPHRASE"
          EOF

          chmod 700 "$RUNNER_TEMP/ssh-askpass.sh"

          eval "$(ssh-agent -s)"

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          DISPLAY=:0 \
          ssh-add "$RUNNER_TEMP/cpanel_key" </dev/null

          rm -f "$RUNNER_TEMP/cpanel_key"
          rm -f "$RUNNER_TEMP/ssh-askpass.sh"

          ssh-keyscan -H -p 21098 publkey.com >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Push to cPanel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove cpanel 2>/dev/null || true

          git remote add cpanel \
            "ssh://publkey4@publkey.com:21098/home/publkey4/repositories/pulse-dashboard-auto"

          git push cpanel HEAD:master


      - name: Verify DEV site
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://pulse.publkey.com"
          VERIFY_DIR="$RUNNER_TEMP/live-verify"
          mkdir -p "$VERIFY_DIR"

          for attempt in {1..30}; do
            all_ok=true

            while IFS= read -r -d '' file; do
              rel="${file#public/}"
              out="$VERIFY_DIR/${rel//\//_}"

              if ! curl -fsSL --max-time 10 "${BASE_URL}/${rel}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$out"; then
                all_ok=false
                break
              fi

              if ! cmp -s "$file" "$out"; then
                all_ok=false
                break
              fi
            done < <(find public -type f -print0 | sort -z)

            if [ "$all_ok" = "true" ]; then
              echo "DEV deployment verified against every file in public/."
              exit 0
            fi

            echo "DEV site not fully updated yet (attempt $attempt/30); waiting..."
            sleep 2
          done

          echo "DEV deployment verification failed."
          exit 1
