name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse-cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync source package to public
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_SYNC=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_SYNC=true
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^source/'; then
            SHOULD_SYNC=true
          fi

          if [ "$SHOULD_SYNC" = "true" ] && [ -f source/READY ]; then
            cat source/pulse_dashboard_v3_5.zip.b64.part* > "$RUNNER_TEMP/pulse-source.b64"
            base64 -d "$RUNNER_TEMP/pulse-source.b64" > "$RUNNER_TEMP/pulse-source.zip"

            echo "f967509c7baadd1ce46c7602c479cf36330d9dec977d710d8f45abe4702647d4  $RUNNER_TEMP/pulse-source.zip" | sha256sum -c -

            rm -rf "$RUNNER_TEMP/pulse-source"
            mkdir -p "$RUNNER_TEMP/pulse-source"
            unzip -q -o "$RUNNER_TEMP/pulse-source.zip" -d "$RUNNER_TEMP/pulse-source"

            mkdir -p public
            rsync -a --delete --exclude='preview/' "$RUNNER_TEMP/pulse-source/" public/

            node --check public/app.js

            git add public
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Restore Pulse Dashboard v3.5 [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Check preview schedule API
        run: php -l public/preview/schedule-api.php

      - name: Configure SSH
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$CPANEL_SSH_KEY" > "$RUNNER_TEMP/cpanel_key"
          chmod 600 "$RUNNER_TEMP/cpanel_key"

          cat > "$RUNNER_TEMP/ssh-askpass.sh" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$CPANEL_SSH_PASSPHRASE"
          EOF

          chmod 700 "$RUNNER_TEMP/ssh-askpass.sh"

          eval "$(ssh-agent -s)"

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          DISPLAY=:0 \
          ssh-add "$RUNNER_TEMP/cpanel_key" </dev/null

          rm -f "$RUNNER_TEMP/cpanel_key"
          rm -f "$RUNNER_TEMP/ssh-askpass.sh"

          # Retry transient DNS/network failures without disabling host-key checking.
          host_keys="$RUNNER_TEMP/cpanel_known_hosts"
          for attempt in {1..12}; do
            if ssh-keyscan -T 10 -H -p 21098 publkey.com > "$host_keys" 2>/dev/null && [ -s "$host_keys" ]; then
              cat "$host_keys" >> "$HOME/.ssh/known_hosts"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Unable to obtain cPanel SSH host key after 12 attempts."
              exit 1
            fi
            echo "SSH host key scan attempt $attempt/12 failed; retrying..."
            sleep 5
          done
          rm -f "$host_keys"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Push to cPanel
        shell: bash
        run: |
          set -euo pipefail

          git remote remove cpanel 2>/dev/null || true

          git remote add cpanel \
            "ssh://publkey4@publkey.com:21098/home/publkey4/repositories/pulse-dashboard-auto"

          # Capture the actual cPanel revision before deploying, not github.event.before.
          # If it cannot be read, verification will safely check the entire public/ tree.
          baseline=""
          if baseline=$(git ls-remote cpanel refs/heads/master | awk '{print $1}'); then
            if [ -n "$baseline" ] && git fetch --no-tags cpanel master; then
              if git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
                echo "CPANEL_BASE_SHA=$baseline" >> "$GITHUB_ENV"
                echo "Previous cPanel revision: $baseline"
              else
                echo "::warning::Previous cPanel commit unavailable; full verification will run."
              fi
            else
              echo "::warning::Cannot fetch previous cPanel revision; full verification will run."
            fi
          else
            echo "::warning::Cannot read previous cPanel revision; full verification will run."
          fi

          git push cpanel HEAD:master


      - name: Verify DEV site
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="https://pulse.publkey.com"
          VERIFY_DIR="$RUNNER_TEMP/live-verify"
          mkdir -p "$VERIFY_DIR"

          # Compare with the cPanel revision captured immediately before push.
          # A missing/unusable baseline must never silently skip verification.
          file_list="$RUNNER_TEMP/verify-files.list"
          deleted_list="$RUNNER_TEMP/verify-deleted.list"
          : > "$file_list"
          : > "$deleted_list"
          if [ -n "${CPANEL_BASE_SHA:-}" ] && git cat-file -e "${CPANEL_BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMRT -z "$CPANEL_BASE_SHA" HEAD -- public/ > "$file_list"
            git diff --name-only --diff-filter=D -z "$CPANEL_BASE_SHA" HEAD -- public/ > "$deleted_list"
            echo "Verification mode: changed files since cPanel revision $CPANEL_BASE_SHA"
          else
            find public -type f -print0 | sort -z > "$file_list"
            echo "Verification mode: FULL (previous cPanel revision unavailable)"
          fi

          # No changes means the prior deployment is already at this revision.
          if [ ! -s "$file_list" ] && [ ! -s "$deleted_list" ]; then
            echo "No public/ changes to verify against the previous cPanel revision."
            exit 0
          fi

          for attempt in {1..30}; do
            all_ok=true
            while IFS= read -r -d '' file; do
              rel="${file#public/}"
              out="$VERIFY_DIR/$(printf '%s' "$rel" | sha256sum | cut -d' ' -f1)"
              echo "Checking: $rel (attempt $attempt/30)"
              if ! http_code=$(curl -sSL --max-time 10 -w '%{http_code}' "${BASE_URL}/${rel}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt" -o "$out"); then
                echo "::warning file=$file::HTTP request failed for $rel"
                all_ok=false
                break
              fi
              # PHP executes on the server. Check its method guard instead of comparing source bytes.
              if [ "$rel" = "preview/schedule-api.php" ]; then
                if [ "$http_code" != "405" ] || ! jq -e '.error == "schedule_post_required"' "$out" > /dev/null; then
                  echo "::warning file=$file::Preview schedule API verification failed (HTTP $http_code)"
                  all_ok=false
                  break
                fi
                echo "Verified PHP execution: $rel"
                continue
              fi
              if [ "$http_code" != "200" ]; then
                echo "::warning file=$file::HTTP $http_code for $rel (expected 200)"
                all_ok=false
                break
              fi
              if ! cmp -s "$file" "$out"; then
                echo "::warning file=$file::Content mismatch for $rel"
                all_ok=false
                break
              fi
              echo "Verified: $rel"
            done < "$file_list"

            if [ "$all_ok" = "true" ]; then
              while IFS= read -r -d '' file; do
                rel="${file#public/}"
                echo "Checking removed file: $rel (attempt $attempt/30)"
                if ! http_code=$(curl -sSL --max-time 10 -w '%{http_code}' "${BASE_URL}/${rel}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt" -o /dev/null); then
                  echo "::warning file=$file::HTTP request failed while checking removal of $rel"
                  all_ok=false
                  break
                fi
                if [ "$http_code" != "404" ] && [ "$http_code" != "410" ]; then
                  echo "::warning file=$file::Removed file $rel still returns HTTP $http_code (expected 404 or 410)"
                  all_ok=false
                  break
                fi
                echo "Verified removed: $rel"
              done < "$deleted_list"
            fi

            if [ "$all_ok" = "true" ]; then
              echo "DEV deployment verified successfully."
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              echo "DEV site not yet matching (attempt $attempt/30); retrying..."
              sleep 2
            fi
          done

          echo "::error::DEV deployment verification failed after 30 attempts."
          exit 1
