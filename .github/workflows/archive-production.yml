name: Build production backup archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/archive-production.yml"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build production archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pulse-production"
          rsync -a --exclude='preview/' public/ "$RUNNER_TEMP/pulse-production/"
          cd "$RUNNER_TEMP/pulse-production"
          zip -qr "$RUNNER_TEMP/Pulse_Production_3.9_2026-11-01.zip" .
      - name: Upload production archive
        uses: actions/upload-artifact@v4
        with:
          name: Pulse_Production_3.9_2026-11-01
          path: ${{ runner.temp }}/Pulse_Production_3.9_2026-11-01.zip
          if-no-files-found: error
          retention-days: 7
